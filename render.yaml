# Render Blueprint for the mobile app's sync service (sync_service/).
# Render dashboard -> New -> Blueprint -> pick this repository. See
# sync_service/README.md for the full steps.
services:
  - type: web
    name: amity-icmr-sync
    runtime: python
    plan: free
    region: singapore
    rootDir: sync_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Same database as the web app (Streamlit secrets -> [mongodb]
      # connection_string). Entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: virus_prediction
      # Same Clerk application as the web app.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_ZGl2aW5lLWNvZC00Mi5jbGVyay5hY2NvdW50cy5kZXYk
